<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS laboratory</title>
    <link rel="icon" type="image/x-icon" href="jslogo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
</head>

<body>

    <header class="site-header">
        <nav class="site-nav">
            <!-- Brand -->
            <a href="index.html" class="brand">
                <div class="js-badge" aria-hidden="true">JS</div>
                <span class="brand-name">laboratory</span>

            <!-- Right link -->
            <div class="nav-links">
                <a href="https://github.com/DoomedZero/js-playground" target="_blank" rel="noopener noreferrer"
                    class="nav-link icon-link" title="GitHub Repository">
                    <svg height="28" width="28" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                    </svg>
                </a>
            </div>
        </nav>
    </header>

    <!-- MDN-Style Mobile Sub-Bar -->
    <div class="mobile-subbar">
        <button class="subbar-toggle-btn" id="drawer-toggle">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path fill-rule="evenodd" d="M2.5 12a.75.75 0 0 1 .75-.75h9.5a.75.75 0 0 1 0 1.5h-9.5A.75.75 0 0 1 2.5 12zm0-4.5a.75.75 0 0 1 .75-.75h9.5a.75.75 0 0 1 0 1.5h-9.5A.75.75 0 0 1 2.5 7.5zm0-4.5a.75.75 0 0 1 .75-.75h9.5a.75.75 0 0 1 0 1.5h-9.5A.75.75 0 0 1 2.5 3z"></path>
            </svg>
            <span>Menu & Topics</span>
        </button>
    </div>

    <!-- Mobile Drawer Backdrop -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="layout">
        <!-- Sidebar (Desktop Fixed Sidebar / Mobile Off-canvas Drawer) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title-row">
                    <span class="sidebar-heading">Navigation</span>
                    <button class="drawer-close-btn" id="drawer-close" aria-label="Close menu">✕</button>
                </div>
                <input type="text" id="search-input" placeholder="Search exercises..." autocomplete="off">
            </div>
            <nav id="sidebar-nav" class="nav-tree"></nav>
        </aside>

        <!-- Main Content Reader -->
        <main class="content-view">
            <div id="active-snippet-container"></div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script type="module" src="js/render.js"></script>
</body>

</html>
